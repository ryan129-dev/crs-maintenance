<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini · CRS 测试</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172238;font:16px system-ui,sans-serif}main{max-width:720px;margin:5vh auto;padding:24px}section{background:#fff;border:1px solid #dce2eb;border-radius:16px;padding:22px}h1{margin:0;font-size:26px}p,small{color:#53627a}label{display:block;margin:14px 0 6px}input,textarea,button{font:inherit;border-radius:8px;padding:10px}input,textarea{width:100%;border:1px solid #b9c5d6}textarea{resize:vertical}button{background:#234ac2;color:white;border:0;cursor:pointer}button:disabled{opacity:.55}#chat{min-height:160px;max-height:45vh;overflow:auto;margin:16px 0;padding:12px;background:#f4f6fa;border-radius:10px}#chat div{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}#status{min-height:1.5em;overflow-wrap:anywhere}
</style>
<main><section>
<h1>Gemini 对话测试</h1>
<p>manju-pool · <code>gemini-3.5-flash-lite</code></p>
<p>CRS Base URL <code>https://manju-pool.xiaoniuds.com/gemini</code></p>
<form id="form">
<label for="key">CRS API Key</label>
<input id="key" type="password" autocomplete="off" required>
<small>Key 只保留在当前页面，并随请求发送到 CRS。</small>
<label for="mode">模式</label>
<select id="mode">
<option value="chat">文本对话 · gemini-3.5-flash-lite</option>
<option value="image">生图 · gemini-3.1-flash-image</option>
</select>
<div id="chat" role="log" aria-label="对话"></div>
<label for="message">消息</label>
<textarea id="message" rows="3" required placeholder="例如：记住我的代号是蓝鲸，只回复收到。"></textarea>
<p id="status" role="status"></p>
<button id="send">发送</button>
<button id="reset" type="button">清空对话</button>
</form>
</section></main>
<script>
const get = id => document.getElementById(id);
const history = [];
function append(label, text) {
  const row = document.createElement('div');
  row.textContent = label + '：' + text;
  get('chat').append(row);
  row.scrollIntoView({block:'nearest'});
}
get('reset').onclick = () => {
  history.length = 0;
  get('chat').replaceChildren();
  get('status').textContent = '';
};
get('form').onsubmit = async event => {
  event.preventDefault();
  const key = get('key').value.trim();
  const message = get('message').value.trim();
  if (!key || !message) return;
  const imageMode = get('mode').value === 'image';
  const turn = {role:'user', parts:[{text:message}]};
  get('send').disabled = get('reset').disabled = true;
  get('status').textContent = imageMode ? '正在生成图片…' : '请求中…';
  try {
    const response = await fetch(imageMode ? '/image' : '/generate', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key},
      body:JSON.stringify(imageMode ? {contents:[turn],generationConfig:{responseModalities:['TEXT','IMAGE']}} : {contents:[...history, turn]}),
      signal:AbortSignal.timeout(120000)
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const detail = typeof data.error === 'string' ? data.error : data.error?.message;
      throw new Error('HTTP ' + response.status + (detail ? ' · ' + detail : ''));
    }
    const content = data.candidates?.[0]?.content;
    const answer = (content?.parts || []).filter(part => !part.thought).map(part => part.text || '').join('');
    if (imageMode) {
      const images = (content?.parts || []).filter(part =>
        /^image\/(png|jpeg|webp|gif)$/.test(part.inlineData?.mimeType || '') && part.inlineData.data);
      if (!images.length) throw new Error('HTTP ' + response.status + ' · Gemini 未返回图片' + (answer ? ' · ' + answer : ''));
      append('你', message);
      for (const part of images) {
        const img = document.createElement('img');
        img.alt = 'Gemini 生成的图片';
        img.style.maxWidth = '100%';
        img.src = 'data:' + part.inlineData.mimeType + ';base64,' + part.inlineData.data;
        get('chat').append(img);
      }
      if (answer) append('Gemini', answer);
      if (get('message').value.trim() === message) get('message').value = '';
      get('status').textContent = 'HTTP ' + response.status;
      return;
    }
    if (!answer) throw new Error('HTTP ' + response.status + ' · Gemini 未返回文本');
    history.push(turn, {...content, role:'model'});
    append('你', message);
    append('Gemini', answer);
    if (get('message').value.trim() === message) get('message').value = '';
    get('status').textContent = 'HTTP ' + response.status;
  } catch (error) {
    get('status').textContent = error.message.split(key).join('[已隐藏]');
  } finally {
    get('send').disabled = get('reset').disabled = false;
  }
};
</script>
</html>
